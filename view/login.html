<!DOCTYPE html>
<html>
<head>
    <title>Lost and Found - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            font-family: Arial;
            background-color: #f5f6fa;
            color: #1f2937;
            overflow: hidden;
        }

        .box {
            width: 400px;
            margin: 70px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .login {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background-color: #1683c7;
            color: white;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #1683c7;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Lost and Found</h1>

    <h2>Welcome Back</h2>

    <p style="text-align:center;">Log in to your account</p>

    <form>

        <label>Email</label>
        <input type="email" name="email">

        <label>Password</label>
        <input type="password" name="password">

        <p>
            <a href="#">Forgot Password?</a>
        </p>

        <button class="login" type="submit">
            Log In
        </button>

    </form>

    <p class="register">
        Don't have an account?
        <a href="#">Register</a>
    </p>

</div>

</body>
</html>
